# ============================================================
# 站点级主题配置覆盖（landscape 主题汉化）
# ============================================================
# 作用：这里的配置会「深度合并」进主题自带的 _config.yml，
#       同名字段覆盖主题默认值，未提及的字段继续沿用主题默认。
#
# 重要：本文件位于站点根目录，【不会】被 npm 更新主题时覆盖。
#       所以汉化请改这里，不要去改 node_modules\hexo-theme-landscape\_config.yml。
# ============================================================

# ===============
# 导航菜单
# ===============
# 键名 = 导航栏上显示的文字，值 = 链接地址
# 想加新导航项，照着格式加一行即可（注意保持两个空格缩进）
menu:
  首页: /
  归档: /archives

# 文章摘要下方的「阅读全文」链接文字。设为 false 可隐藏该链接。
excerpt_link: 阅读全文
